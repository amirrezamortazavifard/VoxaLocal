[package]
name = "voxlocal"
version = "0.1.0"
description = "VoxaLocal — Offline Persian & English Speech Recognition Studio"
edition = "2021"

[lib]
name = "voxlocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tinyasr = { path = "../vendor/tinyasr" }
cpal = "0.15"
rubato = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
symphonia = { version = "0.5", features = ["all"] }
flate2 = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
opus-decoder = "0.1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
] }

# Ensure tinyasr and numerical crates run at full release speed even during `npm run tauri dev`
[profile.dev.package.tinyasr]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
