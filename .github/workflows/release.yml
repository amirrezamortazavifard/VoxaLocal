name: 'Release Multi-Platform Packages'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and package Tauri desktop app
        uses: tauri-apps/action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VoxaLocal ${{ github.ref_name }}'
          releaseBody: |
            ## 🌟 VoxaLocal Desktop Release (${{ github.ref_name }})
            
            Welcome to **VoxaLocal**, the 100% offline Persian and English Speech Recognition Studio!
            
            ### 📦 Download Assets
            - **Windows**: Download the `.exe` (NSIS setup) or `.msi` (WiX enterprise installer).
            - **macOS**: Download the `.dmg` installer (Universal binary supporting Apple Silicon M-series & Intel).
            - **Linux**: Download the `.AppImage` (portable standalone) or `.deb` (Debian/Ubuntu).
            
            ### 🚀 Highlights
            - 100% Offline & Private (No telemetry, no cloud APIs).
            - Powered by native TinyASR int4 SIMD Zipformer2 engine.
            - Streaming recognition + Full-context re-decoding.
            - Silero VAD v5 voice activity detection.
            - Audio file transcription (WAV, MP3, FLAC, M4A) with SRT subtitle export.
            - Persian typography harmonizer (Smart ZWNJ).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
