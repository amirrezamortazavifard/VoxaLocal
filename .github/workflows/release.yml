name: 'Release Multi-Platform Packages'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev cmake build-essential

      - name: Install frontend dependencies
        run: npm ci

      - name: Download & verify offline wake-word KWS model (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2"
          $expected = "F170013B4716E41B62B9BFD809687C207CEF798EF9BC6534D524E17AF9B6561A"
          $tmp = Join-Path $env:RUNNER_TEMP "kws_model.tar.bz2"
          Invoke-WebRequest -Uri $url -OutFile $tmp
          $actual = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToUpper()
          if ($actual -ne $expected) { throw "SHA256 mismatch: $actual != $expected" }
          New-Item -ItemType Directory -Force -Path "src-tauri/models/wakeword" | Out-Null
          tar -xjf $tmp --strip-components=1 -C "src-tauri/models/wakeword"
          Set-Content -Path "src-tauri/models/wakeword/keywords.txt" -Value "▁HE Y ▁ VO X A @hey_voxa`n" -NoNewline -Encoding utf8
          Get-Item "src-tauri/models/wakeword/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx","src-tauri/models/wakeword/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx","src-tauri/models/wakeword/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx","src-tauri/models/wakeword/tokens.txt","src-tauri/models/wakeword/keywords.txt" | ForEach-Object { if ($_.Length -eq 0) { throw "Empty wakeword file: $($_.FullName)" } }

      - name: Download & verify offline wake-word KWS model (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2"
          EXPECTED="f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a"
          TMP_ARCHIVE="${RUNNER_TEMP}/kws_model.tar.bz2"
          curl -fsSL "$URL" -o "$TMP_ARCHIVE"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$EXPECTED  $TMP_ARCHIVE" | sha256sum -c -
          else
            echo "$EXPECTED  $TMP_ARCHIVE" | shasum -a 256 -c -
          fi
          mkdir -p src-tauri/models/wakeword
          tar -xjf "$TMP_ARCHIVE" --strip-components=1 -C src-tauri/models/wakeword
          printf '▁HE Y ▁ VO X A @hey_voxa\n' > src-tauri/models/wakeword/keywords.txt
          for f in encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx tokens.txt keywords.txt; do
            test -s "src-tauri/models/wakeword/$f"
          done

      - name: Build and package Tauri desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VoxaLocal ${{ github.ref_name }}'
          releaseBody: |
            ## 🌟 VoxaLocal Desktop Release (${{ github.ref_name }})
            
            Welcome to **VoxaLocal**, the 100% offline Persian and English Speech Recognition Studio!
            
            ### 🧠 Zero-Setup Bundled AI Models
            All installer packages come with pre-packaged Persian-English Zipformer2 & Silero VAD AI models.
            **No manual downloads or configuration required** — simply install and start dictating right away!
            
            ### 📦 Download Assets
            - **Windows**: Download the `.exe` (NSIS setup installer) or `.msi` (WiX enterprise installer).
            - **macOS**: Download the `.dmg` installer (Universal binary supporting Apple Silicon M-series & Intel).
            - **Linux**: Download the `.AppImage` (portable standalone) or `.deb` (Debian/Ubuntu).
            
            ### 🚀 Highlights
            - **100% Offline & Private**: Zero network access, zero cloud telemetry, complete on-device privacy.
            - **Global Push-to-Talk / Toggle Dictation**: Trigger with `Ctrl + Shift + B` from any desktop app.
            - **Native TinyASR int4 SIMD**: Zipformer2 streaming transducer with full-context re-decoding.
            - **Silero VAD v5**: Fast, accurate speech/silence detection.
            - **Audio File Transcription**: Transcribe WAV, MP3, FLAC, M4A, and OGG (Opus) files with live Telegram-style waveform timeline and real-time word streaming.
            - **Persian Typography Normalizer**: Smart ZWNJ (half-space) and character unification.
            - **Multi-Format Export**: Copy instantly, or export as Subtitles (`.srt`), Plain Text (`.txt`), or Timestamped JSON.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
